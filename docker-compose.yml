version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omc_user
      POSTGRES_PASSWORD: omc_pass
      POSTGRES_DB: omc_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omc_user -d omc_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: omc_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: omc_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://omc_user:omc_pass@postgres:5432/omc_db
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    ports:
      - '4000:4000'
    volumes:
      - ./server/uploads:/app/uploads

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: omc_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
    environment:
      VITE_API_URL: http://localhost:4000

volumes:
  postgres_data:
  redis_data:
