# Netlify Configuration for GSDAP (Ghana Student Digital Access Programme)

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  VITE_SUPABASE_URL = "https://bpvjxenorzxummlgdwuf.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwdmp4ZW5vcnp4dW1tbGdkd3VmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0ODI0NjAsImV4cCI6MjEwODA1ODQ2MH0.Adre7RfUkDf7WSED1NmciQcwWJY16rpHYiYxXjjYMNI"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
